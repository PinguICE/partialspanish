<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BioLingo · Biology III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="logo">biolingo</div>
    <div class="stats">
      <span class="stat fire" title="Racha de días">🔥 <span id="sStreak">0</span></span>
      <span class="stat xp" title="Experiencia">⚡ <span id="sXp">0</span></span>
      <button class="stat err" id="sErrBtn" title="Errores por repasar">💔 <span id="sErr">0</span></button>
      <button class="stat" id="sndBtn" title="Sonido">🔊</button>
    </div>
  </header>
  <main id="main"></main>
</div>
<nav class="nav"><div class="nav-in">
  <button data-tab="learn" class="on"><span class="ic">🏠</span>Aprender</button>
  <button data-tab="cards"><span class="ic">🃏</span>Tarjetas</button>
  <button data-tab="kahoot"><span class="ic">🎮</span>Kahoot</button>
  <button data-tab="exam"><span class="ic">📝</span>Examen</button>
  <button data-tab="notes"><span class="ic">📖</span>Apuntes</button>
</div></nav>
<div id="overlay"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
